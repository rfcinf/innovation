[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacand"
version = "0.1.0"
description = "Candidaturas assistidas no LinkedIn: busca, pontua, preenche e envia sob revisão."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69.0",
    "playwright>=1.48.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lacand = "lacand.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
